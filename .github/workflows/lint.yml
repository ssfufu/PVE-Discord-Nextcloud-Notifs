name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jenkinsfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run npm-groovy-lint
        run: npx --yes npm-groovy-lint@15 --failon warning Jenkinsfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck -s bash tools/*.sh
